<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 780" role="img" aria-label="Okuri-ashi forward: right foot steps forward (movements 1 and 3) while left foot follows (movements 2 and 4)">
  <title>Okuri-ashi (forward)</title>
  <defs>
    <g id="foot-r">
      <path d="M 45 224
               C 36 224 32 216 32 204
               C 32 190 38 178 39 163
               C 41 149 34 139 30 125
               C 26 111 21 97 24 85
               C 29 72 39 66 51 66
               C 65 66 77 72 82 85
               C 85 100 84 115 82 132
               C 80 158 79 180 78 204
               C 78 216 72 224 65 224
               Z"/>
      <ellipse cx="28.5" cy="54" rx="7.5" ry="13.5" transform="rotate(-12 28.5 54)"/>
      <ellipse cx="44.5" cy="50" rx="6" ry="9.5" transform="rotate(-3 44.5 50)"/>
      <ellipse cx="58" cy="50" rx="5" ry="8" transform="rotate(5 58 50)"/>
      <ellipse cx="70" cy="55.5" rx="4.2" ry="6.5" transform="rotate(13 70 55.5)"/>
      <ellipse cx="80" cy="65" rx="3.4" ry="5.2" transform="rotate(22 80 65)"/>
    </g>
    <g id="foot-l">
      <use href="#foot-r" transform="translate(100 0) scale(-1 1)"/>
    </g>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z"/>
    </marker>
  </defs>
  <rect width="420" height="780" fill="#ffffff"/>

  <!-- right foot positions -->
  <use href="#foot-r" fill="#111111" transform="translate(246.7 35.6) scale(0.6)"/>
  <use href="#foot-r" fill="#111111" transform="translate(246.7 255.6) scale(0.6)"/>
  <use href="#foot-r" fill="#111111" transform="translate(246.7 475.6) scale(0.6)"/>

  <!-- left foot positions -->
  <use href="#foot-l" fill="#111111" transform="translate(113.3 145.6) scale(0.6)"/>
  <use href="#foot-l" fill="#111111" transform="translate(113.3 365.6) scale(0.6)"/>
  <use href="#foot-l" fill="#111111" transform="translate(113.3 585.6) scale(0.6)"/>

  <!-- arrows: right foot movements 1 and 3, left foot movements 2 and 4 -->
  <g stroke="#111111" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M 276.7 494 L 276.7 396" marker-end="url(#ah)"/>
    <path d="M 276.7 274 L 276.7 176" marker-end="url(#ah)"/>
    <path d="M 143.3 604 L 143.3 506" marker-end="url(#ah)"/>
    <path d="M 143.3 384 L 143.3 286" marker-end="url(#ah)"/>
  </g>

  <!-- movement numbers next to arrows -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    <circle cx="310.7" cy="445" r="17" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <text x="310.7" y="445" dy="0.35em" fill="#111111">1</text>
    <circle cx="310.7" cy="225" r="17" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <text x="310.7" y="225" dy="0.35em" fill="#111111">3</text>
    <circle cx="109.3" cy="555" r="17" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <text x="109.3" y="555" dy="0.35em" fill="#111111">2</text>
    <circle cx="109.3" cy="335" r="17" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <text x="109.3" y="335" dy="0.35em" fill="#111111">4</text>
  </g>
</svg>
