<svg xmlns="http://www.w3.org/2000/svg" viewBox="7 158 249 441" role="img" aria-label="Tsugi-ashi: left foot steps up to touch or pass the right foot (1), then right foot steps forward to strike (2)">
  <title>Tsugi-ashi</title>
  <defs>
    <g id="foot-r">
      <path d="M 45 224
               C 36 224 32 216 32 204
               C 32 190 38 178 39 163
               C 41 149 34 139 30 125
               C 26 111 21 97 24 85
               C 29 72 39 66 51 66
               C 65 66 77 72 82 85
               C 85 100 84 115 82 132
               C 80 158 79 180 78 204
               C 78 216 72 224 65 224
               Z"/>
      <ellipse cx="28.5" cy="54" rx="7.5" ry="13.5" transform="rotate(-12 28.5 54)"/>
      <ellipse cx="44.5" cy="50" rx="6" ry="9.5" transform="rotate(-3 44.5 50)"/>
      <ellipse cx="58" cy="50" rx="5" ry="8" transform="rotate(5 58 50)"/>
      <ellipse cx="70" cy="55.5" rx="4.2" ry="6.5" transform="rotate(13 70 55.5)"/>
      <ellipse cx="80" cy="65" rx="3.4" ry="5.2" transform="rotate(22 80 65)"/>
    </g>
    <g id="foot-l">
      <use href="#foot-r" transform="translate(100 0) scale(-1 1)"/>
    </g>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z"/>
    </marker>
    <marker id="ah-s" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z"/>
    </marker>
  </defs>

  <!-- right foot: start and end -->
  <use href="#foot-r" fill="#111111" transform="translate(193.4 354.4) scale(0.6)"/>
  <use href="#foot-r" fill="#111111" transform="translate(193.4 134.4) scale(0.6)"/>

  <!-- left foot: start (black), short step up (gray, overlapping) -->
  <use href="#foot-l" fill="#111111" transform="translate(60.0 464.4) scale(0.6)"/>
  <use href="#foot-l" fill="#999999" transform="translate(60.0 409.4) scale(0.6)"/>

  <!-- arrows: 1 = short left step (pulled to the side), 2 = right foot step -->
  <g stroke="#111111" stroke-linecap="round" fill="none">
    <path d="M 60.0 592.8 L 60.0 549.8" stroke-width="5" marker-end="url(#ah-s)"/>
    <path d="M 193.4 372.8 L 193.4 274.8" stroke-width="7" marker-end="url(#ah)"/>
  </g>

  <!-- movement numbers next to arrows -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    <circle cx="26.0" cy="571.3" r="17" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <text x="26.0" y="571.3" dy="0.35em" fill="#111111">1</text>
    <circle cx="237.4" cy="323.8" r="17" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <text x="237.4" y="323.8" dy="0.35em" fill="#111111">2</text>
  </g>
</svg>
