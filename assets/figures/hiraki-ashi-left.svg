<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Hiraki-ashi: left foot steps diagonally forward and to the left, pivoting 45 degrees (1), then right foot follows into the new stance (2)">
  <title>Hiraki-ashi (moving left)</title>
  <defs>
    <g id="foot-r">
      <path d="M 45 224
               C 36 224 32 216 32 204
               C 32 190 38 178 39 163
               C 41 149 34 139 30 125
               C 26 111 21 97 24 85
               C 29 72 39 66 51 66
               C 65 66 77 72 82 85
               C 85 100 84 115 82 132
               C 80 158 79 180 78 204
               C 78 216 72 224 65 224
               Z"/>
      <ellipse cx="28.5" cy="54" rx="7.5" ry="13.5" transform="rotate(-12 28.5 54)"/>
      <ellipse cx="44.5" cy="50" rx="6" ry="9.5" transform="rotate(-3 44.5 50)"/>
      <ellipse cx="58" cy="50" rx="5" ry="8" transform="rotate(5 58 50)"/>
      <ellipse cx="70" cy="55.5" rx="4.2" ry="6.5" transform="rotate(13 70 55.5)"/>
      <ellipse cx="80" cy="65" rx="3.4" ry="5.2" transform="rotate(22 80 65)"/>
    </g>
    <g id="foot-l">
      <use href="#foot-r" transform="translate(100 0) scale(-1 1)"/>
    </g>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z"/>
    </marker>
  </defs>
  <rect width="480" height="480" fill="#ffffff"/>

  <!-- start: same pair as hiraki-ashi-right -->
  <use href="#foot-r" fill="#111111" transform="translate(374.4 175.6) scale(0.6)"/>
  <use href="#foot-l" fill="#111111" transform="translate(241 285.6) scale(0.6)"/>

  <!-- movement 1: left foot to the upper left, same y as the right foot's end in hiraki-ashi-right, rotated 45 CW about the ball pivot (local 50,86) -->
  <use href="#foot-l" fill="#111111" transform="translate(85.44 20.04) scale(0.6) rotate(45 50 86)"/>

  <!-- movement 2: right foot behind the left foot, stance swapped to left foot forward -->
  <use href="#foot-r" fill="#111111" transform="translate(101.98 192.14) scale(0.6) rotate(45 50 86)"/>

  <!-- curved arrows showing the pivot -->
  <g stroke="#111111" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M 263 300 Q 155 230 119 135" marker-end="url(#ah)"/>
    <path d="M 396 190 Q 273 300 150 290" marker-end="url(#ah)"/>
  </g>

  <!-- movement numbers next to arrows -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    <circle cx="209" cy="224" r="17" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <text x="209" y="224" dy="0.35em" fill="#111111">1</text>
    <circle cx="273" cy="234" r="17" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <text x="273" y="234" dy="0.35em" fill="#111111">2</text>
  </g>
</svg>
